<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#C45C26" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neshanak — Bookmarks</title>
    <script>
      try {
        var theme = localStorage.getItem("neshanak-theme");
        if (theme) document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {}
      window.__neshanakInstallPrompt = null;
      window.addEventListener("beforeinstallprompt", function (event) {
        event.preventDefault();
        window.__neshanakInstallPrompt = event;
        window.dispatchEvent(new Event("neshanak-can-install"));
      });
      window.addEventListener("appinstalled", function () {
        window.__neshanakInstallPrompt = null;
      });
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
